
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJH Fashion - E-commerce</title>
    <!-- FontAwesome Icons for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            padding-bottom: 70px; /* Space for bottom navbar */
        }

        /* Top Header Navigation */
        .top-header {
            background-color: #ffffff;
            border-bottom: 1px solid #eee;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-size: 18px;
            font-weight: 800;
            color: #0b4d8c;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo span {
            color: #000;
            font-size: 14px;
            border-left: 1px solid #ccc;
            padding-left: 10px;
        }

        .search-icon {
            font-size: 18px;
            color: #0b4d8c;
            cursor: pointer;
        }

        /* Sub Navigation Menu */
        .sub-nav {
            background: #fff;
            display: flex;
            gap: 20px;
            padding: 10px 16px;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            font-size: 14px;
        }

        .sub-nav a {
            text-decoration: none;
            color: #333;
        }

        /* Main Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }

        /* Banner Card */
        .banner-card {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .banner-card img {
            width: 100%;
            display: block;
        }

        /* Product Details Card */
        .product-card {
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .product-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .online-tag {
            color: #2e7d32;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 15px 0;
        }

        .current-price {
            font-size: 24px;
            font-weight: 800;
            color: #000;
        }

        .original-price {
            text-decoration: line-through;
            color: #888;
            font-size: 16px;
        }

        .save-badge {
            background-color: #e53935;
            color: #fff;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* Form Controls & Buttons */
        .btn-size {
            background-color: #0b4d8c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            margin-top: 5px;
        }

        .quantity-control {
            display: inline-flex;
            align-items: center;
            border: 1px solid #0b4d8c;
            border-radius: 20px;
            margin-left: 10px;
            overflow: hidden;
        }

        .quantity-btn {
            background: none;
            border: none;
            padding: 5px 12px;
            color: #0b4d8c;
            font-weight: bold;
            cursor: pointer;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .btn-cart {
            background-color: #6c757d;
            color: white;
        }

        .btn-buy {
            background-color: #0b4d8c;
            color: white;
        }

        /* Checkout / Shipping Form Section */
        .form-section {
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 20px;
        }

        .form-section h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #444;
        }

        .form-group label span {
            color: red;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: #0b4d8c;
        }

        /* Bottom Fixed Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 1000;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            font-size: 11px;
        }

        .bottom-nav-item.active {
            color: #0b4d8c;
        }

        .bottom-nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="top-header">
        <div class="brand-logo">
            MJH Fashion <span>MARKETPLACE</span>
        </div>
        <div class="search-icon">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <!-- Sub Menu -->
    <nav class="sub-nav">
        <a href="#">Mens</a>
        <a href="#">Womens</a>
        <a href="#">Kids</a>
    </nav>

    <!-- Main Content Container -->
    <main class="container">

        <!-- Banner Section -->
        <div class="banner-card">
            <img src="https://via.placeholder.com/600x300?text=Banner+Image" alt="Promo Banner">
        </div>

        <!-- Product Overview Section -->
        <div class="product-card">
            <h1 class="product-title">Laptop and Travelling Minimalist Large Capacity Backpack</h1>
            <div class="online-tag">AVAILABLE ONLINE ONLY</div>
            <p style="font-size: 13px; color: #555;">Brand : <strong>Fashion</strong></p>
            
            <div class="price-row">
                <span class="current-price">৳ 699</span>
                <span class="original-price">৳ 1500</span>
                <span class="save-badge">Save ৳ 801</span>
            </div>

            <div style="margin-bottom: 12px;">
                <label style="font-size: 13px; font-weight: bold; display: block;">Size :</label>
                <button class="btn-size">FREE SIZE</button>
            </div>

            <div style="margin-bottom: 15px; display: flex; align-items: center;">
                <label style="font-size: 13px; font-weight: bold;">Quantity :</label>
                <div class="quantity-control">
                    <button class="quantity-btn">-</button>
                    <span style="padding: 0 10px; font-weight: bold;">1</span>
                    <button class="quantity-btn">+</button>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-cart">ADD TO CART</button>
                <button class="btn btn-buy">BUY NOW</button>
            </div>
        </div>

        <!-- Checkout / Shipping Form Section -->
        <div class="form-section">
            <h3>Shipping Address</h3>
            <form>
                <div class="form-group">
                    <label>Recipient Name <span>*</span></label>
                    <input type="text" class="form-control" placeholder="Full Name" value="MD. JOHIRUL ISLAM">
                </div>

                <div class="form-group">
                    <label>Contact Number <span>*</span></label>
                    <input type="text" class="form-control" placeholder="Mobile Number" value="01309292093">
                </div>

                <div class="form-group">
                    <label>Country</label>
                    <select class="form-control">
                        <option selected>Bangladesh</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>District/City <span>*</span></label>
                    <input type="text" class="form-control" placeholder="Search or Select District" value="Rajshahi">
                </div>

                <div class="form-group">
                    <label>Address <span>*</span></label>
                    <textarea class="form-control" rows="2" placeholder="House / Building / Street">Gazipura 27 Tongi Gazipur</textarea>
                </div>
            </form>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="#" class="bottom-nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="#" class="bottom-nav-item">
            <i class="fa-solid fa-border-all"></i>
            <span>Category</span>
        </a>
        <a href="#" class="bottom-nav-item">
            <i class="fa-solid fa-tags"></i>
            <span>Best Deals</span>
        </a>
        <a href="#" class="bottom-nav-item">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Cart</span>
        </a>
        <a href="#" class="bottom-nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Account</span>
        </a>
    </nav>

</body>
</html>
